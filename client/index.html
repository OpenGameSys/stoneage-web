<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>石器时代 H5</title>
<style>
  /* 4:3 的画面按窗口大小等比缩放（放大、缩小都跟着窗口），永远完整显示、不出现卷轴 */
  html, body { height: 100%; }
  body { margin: 0; background: #000; color: #e8e8ea; font: 14px system-ui, sans-serif; overflow: hidden;
    display: flex; align-items: center; justify-content: center; }
  .stage { position: relative; width: min(100vw, calc(100vh * 4 / 3)); width: min(100vw, calc(100dvh * 4 / 3)); }
  /* 两张画布的像素数由脚本跟着显示大小设定（ui.ts fitView / fitOverlay），一般不会再被浏览器缩放 */
  .stage canvas { display: block; width: 100%; aspect-ratio: 4 / 3; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  /* ?debug 的数据：独立一层盖在画面上面，自带深色底，不会被游戏的字和图盖住 */
  #hud { position: fixed; left: 4px; bottom: 2px; z-index: 10; color: #d0d2da; font-size: 12px; line-height: 16px; white-space: pre;
    background: rgba(0, 0, 0, 0.72); padding: 2px 6px; border-radius: 3px; pointer-events: none; }
  #hud:empty { display: none; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="view" width="800" height="600"></canvas>
  <canvas id="overlay" width="800" height="600"></canvas>
</div>
<div id="hud"></div>
<script type="module" src="dist/main.js?v=mvlcmz3j"></script>
</body>
</html>
