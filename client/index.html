<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>石器时代 H5</title>
<style>
  /* 4:3 的画面按窗口大小等比缩放（放大、缩小都跟着窗口），永远完整显示、不出现卷轴 */
  html, body { height: 100%; }
  body { margin: 0; background: #000; color: #e8e8ea; font: 14px system-ui, sans-serif; overflow: hidden;
    display: flex; align-items: center; justify-content: center; }
  .stage { position: relative; width: min(100vw, calc(100vh * 4 / 3)); width: min(100vw, calc(100dvh * 4 / 3)); }
  .stage canvas { display: block; width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #hud { position: fixed; left: 4px; bottom: 2px; color: #9a9ca5; font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="view" width="800" height="600"></canvas>
  <canvas id="overlay" width="800" height="600"></canvas>
</div>
<div id="hud"></div>
<script type="module" src="dist/main.js?v=mvhakn9g"></script>
</body>
</html>
